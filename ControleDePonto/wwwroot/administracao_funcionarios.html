<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administração de Funcionários | Controle de Ponto</title>

    <link
        rel="stylesheet"
        href="css/administracao_funcionarios.css"
    >
</head>

<body>

    <aside class="sidebar">
        <h2>Controle de Ponto</h2>

        <nav>
            <a href="/home.html">Início</a>

            <a
                href="/administracao_funcionarios.html"
                class="active"
            >
                Funcionários
            </a>

            <a href="/registros.html">Registros</a>

            <a href="/administracao_funcionarios.html">
                Painel Administrativo
            </a>
        </nav>

        <button id="btnSair" type="button">
            Sair
        </button>
    </aside>

    <main class="content">

        <header>
            <h1>Administração de funcionários</h1>

            <p>
                Cadastre, atualize e consulte os funcionários
                sob sua jurisdição.
            </p>
        </header>

        <section class="cards">

            <button
                class="card card-action"
                type="button"
                data-modal="cadastrar"
            >
                <div class="card-icon">+</div>

                <div>
                    <h3>Cadastrar funcionário</h3>

                    <p>
                        Cadastre um novo funcionário no sistema.
                    </p>
                </div>
            </button>

            <button
                class="card card-action"
                type="button"
                data-modal="atualizar"
            >
                <div class="card-icon">✎</div>

                <div>
                    <h3>Atualizar funcionário</h3>

                    <p>
                        Consulte e atualize os dados de um funcionário.
                    </p>
                </div>
            </button>

            <button
                class="card card-action"
                type="button"
                data-modal="listar"
            >
                <div class="card-icon">☷</div>

                <div>
                    <h3>Minha jurisdição</h3>

                    <p>
                        Visualize os funcionários sob sua responsabilidade.
                    </p>
                </div>
            </button>

        </section>

    </main>

    <!-- Fundo escurecido e modal -->

    <div id="modalOverlay" class="modal-overlay">

        <section
            class="modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalTitulo"
        >

            <header class="modal-header">

                <div>
                    <h2 id="modalTitulo">
                        Administração de funcionários
                    </h2>

                    <p id="modalDescricao">
                        Selecione uma opção.
                    </p>
                </div>

                <button
                    id="btnFecharModal"
                    class="btn-fechar"
                    type="button"
                    aria-label="Fechar janela"
                >
                    ×
                </button>

            </header>

            <div id="modalMensagem" class="mensagem"></div>

            <div id="modalConteudo" class="modal-content">
                <!-- Conteúdo inserido pelo JavaScript -->
            </div>

        </section>

    </div>

    <!-- Toast de notificação -->
    <div id="toast" role="alert" aria-live="polite">
        <strong id="toastTitulo"></strong>
        <p id="toastMensagem"></p>
    </div>


    <script src="js/administracao_funcionarios.js"></script>
</body>
</html>

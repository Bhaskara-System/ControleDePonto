<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administração de Funcionários | Controle de Ponto</title>

    <link rel="stylesheet" href="css/administracao_funcionarios.css">
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2>Controle de Ponto</h2>

        <nav>
            <a href="/home.html">Início</a>

            <a href="#">
                Funcionários
            </a>

            <a href="/registros.html">
                Registros
            </a>

            <a href="/administracao_funcionarios.html"
               class="active">
                Painel Administrativo
            </a>
        </nav>


        <!-- Perfil + Botão Sair -->
        <div class="sidebar-footer">

            <!-- Link para o perfil -->
            <a href="/perfil.html"
               class="user-profile-btn"
               title="Ver meu perfil">

                <div class="user-profile">

                    <!-- ADICIONADO: id="avatarSidebar" para vinculação com o global.js -->
                    <img
                        id="avatarSidebar"
                        src="/ft_perfil/sem_foto.png"
                        alt="Foto do Usuário"
                        class="avatar"
                    >

                    <div class="user-info">

                        <span
                            class="user-name"
                            id="nomeSidebar">
                            Nome do Usuário
                        </span>

                        <span
                            class="user-role"
                            id="cargoSidebar">
                            Administrador
                        </span>

                    </div>

                </div>

            </a>


            <!-- Botão Sair -->
            <button
                id="btnSair"
                type="button">
                Sair
            </button>

        </div>

    </aside>


    <!-- Conteúdo principal -->
    <main class="content">

        <header>

            <h1>
                Administração de funcionários
            </h1>

            <p>
                Cadastre, atualize e consulte os funcionários
                sob sua jurisdição.
            </p>

        </header>


        <!-- Cards -->
        <section class="cards">

            <!-- Cadastrar -->
            <button
                class="card card-action"
                type="button"
                data-modal="cadastrar">

                <div class="card-icon">
                    +
                </div>

                <div>

                    <h3>
                        Cadastrar funcionário
                    </h3>

                    <p>
                        Cadastre um novo funcionário no sistema.
                    </p>

                </div>

            </button>


            <!-- Atualizar -->
            <button
                class="card card-action"
                type="button"
                data-modal="atualizar">

                <div class="card-icon">
                    ✎
                </div>

                <div>

                    <h3>
                        Atualizar funcionário
                    </h3>

                    <p>
                        Consulte e atualize os dados de um funcionário.
                    </p>

                </div>

            </button>


            <!-- Listar -->
            <button
                class="card card-action"
                type="button"
                data-modal="listar">

                <div class="card-icon">
                    ☷
                </div>

                <div>

                    <h3>
                        Minha jurisdição
                    </h3>

                    <p>
                        Visualize os funcionários sob sua responsabilidade.
                    </p>

                </div>

            </button>

        </section>

    </main>


    <!-- Modal -->

    <div
        id="modalOverlay"
        class="modal-overlay">

        <section
            class="modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalTitulo">

            <header class="modal-header">

                <div>

                    <h2 id="modalTitulo">
                        Administração de funcionários
                    </h2>

                    <p id="modalDescricao">
                        Selecione uma opção.
                    </p>

                </div>


                <button
                    id="btnFecharModal"
                    class="btn-fechar"
                    type="button"
                    aria-label="Fechar janela">

                    ×

                </button>

            </header>


            <div
                id="modalMensagem"
                class="mensagem">
            </div>


            <div
                id="modalConteudo"
                class="modal-content">

                <!-- Conteúdo inserido pelo JavaScript -->

            </div>

        </section>

    </div>


    <!-- Toast -->

    <div
        id="toast"
        role="alert"
        aria-live="polite">

        <strong id="toastTitulo"></strong>

        <p id="toastMensagem"></p>

    </div>

    
    <!-- Scripts -->
    <script src="js/global.js"></script>
    <script src="js/administracao_funcionarios.js"></script>

</body>

</html>

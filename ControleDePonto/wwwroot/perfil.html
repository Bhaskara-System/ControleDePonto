<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Perfil | Controle de Ponto</title>

    <link rel="stylesheet" href="css/perfil.css">
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2>Controle de Ponto</h2>

        <nav>
            <a href="/home.html">Início</a>
            <a href="#">Funcionários</a>
            <a href="/registros.html">Registros</a>
            <a href="/administracao_funcionarios.html">Painel Administrativo</a>
        </nav>

        <!-- Perfil + Botão Sair -->
        <div class="sidebar-footer">

            <div class="user-profile">
                <img
                    id="avatarSidebar"
                    src="/ft_perfil/sem_foto.png"
                    alt="Foto do Usuário"
                    class="avatar"
                >

                <div class="user-info">
                    <span class="user-name" id="nomeSidebar">Nome do Usuário</span>
                    <span class="user-role" id="cargoSidebar">Administrador</span>
                </div>
            </div>

            <button id="btnSair" type="button">Sair</button>

        </div>

    </aside>


    <!-- Conteúdo principal -->
    <main class="content">

        <header>

            <h1>
                Meu Perfil
            </h1>

            <p>
                Consulte e gerencie suas informações pessoais
                e profissionais.
            </p>

        </header>


        <!-- Card do perfil -->
        <section class="profile-card">

            <!-- Cabeçalho do perfil -->
            <div class="profile-header">

                <img
                    id="perfilAvatar"
                    src="/ft_perfil/sem_foto.png"
                    alt="Foto de perfil"
                    class="perfil-avatar"
                >

                <div class="profile-header-info">

                    <h2 id="perfilNome">
                        Carregando...
                    </h2>

                    <span id="perfilCargo">
                        Carregando...
                    </span>

                </div>

            </div>


            <!-- Formulário -->
            <form id="formPerfil">

                <!-- Informações pessoais -->
                <div class="profile-section">

                    <div class="section-header">

                        <h2>
                            Informações pessoais
                        </h2>

                        <p>
                            Dados pessoais cadastrados no sistema.
                        </p>

                    </div>


                    <div class="form-grid">

                        <!-- CPF (Bloqueado permanentemente) -->
                        <div class="form-group">
                            <label for="perfilCpf">CPF</label>
                            <input type="text" id="perfilCpf" name="cpf" readonly disabled>
                        </div>

                        <!-- Matrícula (Bloqueada permanentemente) -->
                        <div class="form-group">
                            <label for="perfilMatricula">Matrícula</label>
                            <input type="text" id="perfilMatricula" name="matricula" readonly disabled>
                        </div>

                        <!-- Nome -->
                        <div class="form-group full-width">
                            <label for="perfilNomeCompleto">Nome Completo</label>
                            <input type="text" id="perfilNomeCompleto" name="nome" readonly autocomplete="name">
                        </div>

                        <!-- E-mail -->
                        <div class="form-group">
                            <label for="perfilEmail">E-mail</label>
                            <input type="email" id="perfilEmail" name="email" readonly autocomplete="email">
                        </div>

                        <!-- Telefone -->
                        <div class="form-group">
                            <label for="perfilTelefone">Telefone</label>
                            <input type="tel" id="perfilTelefone" name="telefone" readonly autocomplete="tel">
                        </div>

                        <!-- Data de nascimento -->
                        <div class="form-group">
                            <label for="perfilDataNascimento">Data de Nascimento</label>
                            <input type="date" id="perfilDataNascimento" name="dataNascimento" readonly>
                        </div>

                        <!-- Hierarquia (Bloqueada permanentemente) -->
                        <div class="form-group">
                            <label for="perfilHierarquia">Cargo / Hierarquia</label>
                            <input type="text" id="perfilHierarquia" name="hierarquia" readonly disabled>
                        </div>

                    </div>

                </div>


                <!-- Ações -->
                <div class="form-actions">

                    <a href="/home.html" id="btnVoltarInicio" class="btn-secondary">
                        Voltar ao Início
                    </a>

                    <button type="button" id="btnEditarPerfil" class="btn-primary">
                        Editar Perfil
                    </button>

                    <button type="button" id="btnCancelarEdicao" class="btn-secondary" hidden>
                        Cancelar
                    </button>

                    <button type="submit" id="btnSalvarPerfil" class="btn-primary" hidden>
                        Salvar Alterações
                    </button>

                </div>

            </form>

        </section>

    </main>


    <!-- Toast -->
    <div id="toast" role="alert" aria-live="polite">
        <strong id="toastTitulo"></strong>
        <p id="toastMensagem"></p>
    </div>


    <script src="js/global.js"></script>
    <script src="js/perfil.js"></script>

</body>

</html>
